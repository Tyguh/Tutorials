id: getting-started
order: 1
name: Your Skyblock Start
description: Meet your guide, connect your account, and learn the basics on your island.

quests:
  - id: meet-guide
    order: 1
    name: Speak with Our Discord
    description: Follow the floating marker to the Discord NPC at spawn and interact with it.
    completion-at: 1
    target:
      npc: discord
      label: Our Discord
      distance-threshold: 10
    start-actions:
      - type: Message
        content: "Follow the floating <h>objective marker</h> and speak with <h>Our Discord</h> at spawn. The distance appears while you are more than 10 blocks away."
    triggers:
      - type: NpcInteract
        npc: discord
    complete-actions:
      - type: NpcMessage
        speaker: Our Discord
        content: "Welcome to Skyblock! Link your account so your Discord roles, rewards, and Minecraft account stay connected."

  - id: discord
    order: 2
    name: Link Your Discord
    description: Use /discord link and finish the linking flow.
    completion-at: 1
    target:
      npc: discord
      label: Our Discord
      distance-threshold: 10
    start-actions:
      - type: Message
        content: "Use <h>/discord link</h> and finish the link in Discord. This objective completes only after your account is actually linked."
    triggers:
      - type: DiscordLinked

  - id: vote
    order: 3
    name: Vote Twice
    description: Use /vote and complete two votes toward your free rank.
    completion-at: 1
    start-actions:
      - type: Message
        content: "Open <h>/vote</h> and complete two votes. Your real lifetime vote count is checked automatically."
    triggers:
      - type: VoteCount
        minimum-votes: 2

  - id: island
    order: 4
    name: Create Your Island
    description: Use /is create, choose an island, and travel there with /is home.
    completion-at: 1
    start-actions:
      - type: Message
        content: "Use <h>/is create</h>, choose your island, then use <h>/is home</h>. Your island is detected automatically."
    triggers:
      - type: HasIsland

  - id: generator
    order: 5
    name: Mine 16 Generator Blocks
    description: Mine 16 blocks from the cobblestone generator on your island.
    completion-at: 16
    start-actions:
      - type: Message
        content: "Mine <h>16 generator blocks</h> on your island. The generator can produce ores as you progress."
    triggers:
      - type: BlockBreak
        own-island: true
        blocks: [COBBLESTONE, COAL_ORE, IRON_ORE, GOLD_ORE, DIAMOND_ORE, EMERALD_ORE]

  - id: expand
    order: 6
    name: Expand Your Island
    description: Place 16 blocks on your island to make more room.
    completion-at: 16
    start-actions:
      - type: Message
        content: "Use the blocks you mined to place <h>16 blocks</h> anywhere on your island."
    triggers:
      - type: AnyBlockPlace
        own-island: true

  - id: shop
    order: 7
    name: Browse the Shop
    description: Open /shop and look through the server economy.
    completion-at: 1
    start-actions:
      - type: Message
        content: "Open <h>/shop</h> to see what your island can buy and sell."
    triggers:
      - type: Command
        content: /shop

  - id: first-sale
    order: 8
    name: Make Your First Sale
    description: Successfully sell an eligible item through the shop or /sell hand.
    completion-at: 1
    start-actions:
      - type: Message
        content: "Sell an eligible item through the shop or with <h>/sell hand</h>. Only a successful sale counts."
    triggers:
      - type: ShopSale
        currency: money

  - id: settings
    order: 9
    name: Review Island Settings
    description: Use /is settings and learn where island permissions are controlled.
    completion-at: 1
    start-actions:
      - type: Message
        content: "Use <h>/is settings</h>. You can manage teammates with <h>/is members</h> and their access with <h>/is perms</h>."
    triggers:
      - type: Command
        content: /is settings
      - type: Command
        content: /island settings

  - id: free-rank
    order: 10
    name: Claim Your Free Rank
    description: Open /freerank, meet the requirements, and claim the permanent rank.
    completion-at: 1
    start-actions:
      - type: Message
        content: "Open <h>/freerank</h> and claim it after meeting the listed requirements. If you already own it, this objective completes automatically."
    triggers:
      - type: FreeRankClaimed
    complete-actions:
      - type: Message
        content: "Free rank claimed! Your guide will now introduce the systems that help you progress further."

  - id: enchanter
    order: 11
    name: Speak with the Enchanter
    description: Follow the marker to the Enchanter and learn about enchant orbs.
    completion-at: 1
    target:
      npc: enchanter
      label: Enchanter
      distance-threshold: 10
    triggers:
      - type: NpcInteract
        npc: enchanter

  - id: tinkerer
    order: 12
    name: Speak with the Tinkerer
    description: Visit the Tinkerer and learn how enchant dust improves your orbs.
    completion-at: 1
    target:
      npc: tinkerer
      label: Tinkerer
      distance-threshold: 10
    triggers:
      - type: NpcInteract
        npc: tinkerer

  - id: coin-shop
    order: 13
    name: Visit the Coin Shop
    description: Speak with the Coin Shop NPC and see where activity coins are spent.
    completion-at: 1
    target:
      npc: coin-shop
      label: Coin Shop
      distance-threshold: 10
    triggers:
      - type: NpcInteract
        npc: coin-shop

  - id: outpost
    order: 14
    name: Learn About Outposts
    description: Speak with the Outpost NPC to learn about server-wide boosts.
    completion-at: 1
    target:
      npc: outpost
      label: Outposts
      distance-threshold: 10
    triggers:
      - type: NpcInteract
        npc: outpost

  - id: island-top
    order: 15
    name: View the Top Islands
    description: Visit the Island Top NPC and see the islands you are competing against.
    completion-at: 1
    target:
      npc: island-top
      label: Island Top
      distance-threshold: 10
    triggers:
      - type: NpcInteract
        npc: island-top
    complete-actions:
      - type: Message
        content: "You now know the core Skyblock systems. New guided objectives can continue to be added here as more server features open."
